[project]
name = "ecom-lakehouse"
version = "0.1.0"
description = "Production-grade medallion Lakehouse on AWS for e-commerce transactions"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pyspark==3.5.*",
    "delta-spark==3.2.*",
    "pytest>=8",
    "chispa>=0.9",
    "moto[s3,dynamodb]>=5",
    "black",
    "isort",
    "flake8",
    "detect-secrets",
]
glue = [
    "pyspark==3.5.*",
    "delta-spark==3.2.*",
]
ui = [
    "streamlit>=1.35",
    "awswrangler>=3.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests (require local Spark + Delta)",
]
