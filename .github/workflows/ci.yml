name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Java is required by PySpark / Delta Lake
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Cache Ivy2 / Maven jars downloaded by spark --packages
      - name: Cache Spark/Delta JARs
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.m2/repository
          key: "${{ runner.os }}-spark-delta-3.2.0"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}"

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Lint (flake8 + black + isort)
        run: |
          flake8 src/ tests/
          black --check src/ tests/
          isort --check src/ tests/

      - name: Security scan (detect-secrets)
        run: detect-secrets scan --no-verify --baseline .secrets.baseline

      - name: Unit tests
        run: pytest tests/unit/ -q --tb=short

      - name: Integration tests
        run: pytest tests/integration/ -q --tb=short

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/

      - name: Terraform validate (dev)
        working-directory: infra/envs/dev
        run: terraform init -backend=false && terraform validate
